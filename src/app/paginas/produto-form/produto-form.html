<div class="container">
  <div class="topo">
    <h1>{{ editando ? 'Editar produto' : 'Novo produto' }}</h1>
    <a class="btn btn-sec" routerLink="/produtos">Voltar</a>
  </div>

  @if (erros().length) {
    <div class="erros">
      <ul>
        @for (m of erros(); track m) {
          <li>{{ m }}</li>
        }
      </ul>
    </div>
  }

  <form class="formulario" (ngSubmit)="salvar()" novalidate>
    <label>
      Nome
      <input name="nome" [(ngModel)]="nome" />
    </label>

    <label>
      Preço
      <input name="preco" type="number" step="0.01" [(ngModel)]="preco" />
    </label>

    <label>
      Quantidade
      <input name="quantidade" type="number" [(ngModel)]="quantidade" />
    </label>

    <label>
      Categoria
      <select name="categoriaId" [(ngModel)]="categoriaId">
        <option [ngValue]="null">Selecione...</option>
        @for (c of categorias(); track c.id) {
          <option [ngValue]="c.id">{{ c.nome }}</option>
        }
      </select>
    </label>

    <button type="submit" class="btn" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : 'Salvar' }}
    </button>
  </form>
</div>
